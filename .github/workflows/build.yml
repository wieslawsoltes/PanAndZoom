name: Build

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - master
      - main
      - develop

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> $GITHUB_ENV
          else
            echo "VERSION_SUFFIX=-build.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Restore
        run: dotnet restore PanAndZoom.slnx

      - name: Build
        run: dotnet build PanAndZoom.slnx -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> $GITHUB_ENV
          else
            echo "VERSION_SUFFIX=-build.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Restore
        run: dotnet restore PanAndZoom.slnx

      - name: Build
        run: dotnet build PanAndZoom.slnx -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"

      - name: Test
        run: dotnet test PanAndZoom.slnx -c Release --no-build --logger trx --results-directory artifacts/test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: >
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Test Results (${{ matrix.os }})
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  pack:
    name: Pack (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> $GITHUB_ENV
          else
            echo "VERSION_SUFFIX=-build.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Restore
        run: dotnet restore PanAndZoom.slnx

      - name: Build
        run: dotnet build PanAndZoom.slnx -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"

      - name: Pack
        run: dotnet pack PanAndZoom.slnx -c Release --no-build -p:VersionSuffix="${{ env.VERSION_SUFFIX }}" -o artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-ubuntu-latest
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30

  uno-build:
    name: Uno library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            workloads: android wasm-tools
            tfms: net10.0%3Bnet10.0-desktop%3Bnet10.0-browserwasm%3Bnet10.0-android
          - os: windows-latest
            workloads: android ios wasm-tools
            tfms: net10.0%3Bnet10.0-desktop%3Bnet10.0-browserwasm%3Bnet10.0-android%3Bnet10.0-ios
          - os: macos-latest
            workloads: ios android
            tfms: net10.0-ios%3Bnet10.0-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Select latest Xcode
        if: runner.os == 'macOS'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Install workloads
        run: dotnet workload install ${{ matrix.workloads }}

      - name: Build PanAndZoom.Uno
        shell: bash
        run: dotnet build src/PanAndZoom.Uno -c Release "-p:PanAndZoomTargetFrameworks=${{ matrix.tfms }}"

      # WinUI class libraries containing XAML must be built with msbuild (UNOB0008).
      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Build PanAndZoom.Uno (WinAppSDK)
        if: runner.os == 'Windows'
        run: msbuild src/PanAndZoom.Uno/PanAndZoom.Uno.csproj /r /m /p:Configuration=Release /p:PanAndZoomTargetFrameworks=net10.0-windows10.0.26100

  uno-test:
    name: Uno runtime tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install X11 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libx11-6 libxcursor1 libxrandr2 libxi6 libfontconfig1 libice6 libsm6

      - name: Run Uno runtime tests
        shell: bash
        run: build/run-uno-runtime-tests.sh Release

      - name: Upload Uno runtime test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-runtime-test-results-${{ matrix.os }}
          path: artifacts/test-results/uno-runtime-tests.xml
          if-no-files-found: warn
          retention-days: 7

  uno-sample:
    name: Uno sample (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build desktop sample
        run: dotnet build samples/UnoDemo -c Release -f net10.0-desktop -p:PanAndZoomTargetFrameworks=net10.0-desktop -p:UnoDemoTargetFrameworks=net10.0-desktop

      - name: Install X11 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libx11-6 libxcursor1 libxrandr2 libxi6 libfontconfig1 libice6 libsm6

      - name: Run sample self-test (all demo pages)
        if: runner.os == 'Linux'
        env:
          UNODEMO_SELFTEST: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" dotnet run --project samples/UnoDemo -c Release -f net10.0-desktop --no-build -p:PanAndZoomTargetFrameworks=net10.0-desktop -p:UnoDemoTargetFrameworks=net10.0-desktop

      - name: Install wasm-tools
        if: runner.os == 'Linux'
        run: dotnet workload install wasm-tools

      - name: Publish WebAssembly sample
        if: runner.os == 'Linux'
        run: dotnet publish samples/UnoDemo -c Release -f net10.0-browserwasm -p:PanAndZoomTargetFrameworks=net10.0-browserwasm -p:UnoDemoTargetFrameworks=net10.0-browserwasm -o artifacts/unodemo-wasm

      - name: Upload WebAssembly sample
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: unodemo-wasm
          path: artifacts/unodemo-wasm/wwwroot
          if-no-files-found: error
          retention-days: 7

  uno-pack:
    name: Pack Uno (windows-latest)
    runs-on: windows-latest
    needs: [uno-build, uno-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install workloads
        run: dotnet workload install android ios wasm-tools

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> $GITHUB_ENV
          else
            echo "VERSION_SUFFIX=-build.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      # WinUI class libraries containing XAML must be built with msbuild (UNOB0008).
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Pack PanAndZoom.Uno
        shell: bash
        run: msbuild src/PanAndZoom.Uno/PanAndZoom.Uno.csproj -t:Pack -r -m -p:Configuration=Release -p:VersionSuffix="${{ env.VERSION_SUFFIX }}" -p:PackageOutputPath="$GITHUB_WORKSPACE/artifacts/packages"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-uno
          path: |
            artifacts/packages/PanAndZoom.Uno.*.nupkg
            artifacts/packages/PanAndZoom.Uno.*.snupkg
          if-no-files-found: error
          retention-days: 30
