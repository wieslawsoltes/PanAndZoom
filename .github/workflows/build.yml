name: Build

on:
  push:
    branches:
      - master
      - main
      - 'release/**'
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Avalonia + Core build and tests, Uno runtime tests (desktop) on every OS.
  # macOS additionally builds the Uno library for iOS and Android.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install X11 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libx11-6 libxcursor1 libxrandr2 libxi6 libfontconfig1 libice6 libsm6

      - name: Build
        run: dotnet build PanAndZoom.slnx -c Release

      - name: Test
        run: dotnet test PanAndZoom.slnx -c Release --no-build --logger trx --results-directory artifacts/test

      - name: Uno runtime tests
        shell: bash
        run: build/run-uno-runtime-tests.sh Release

      - name: Build Uno library (iOS, Android)
        if: runner.os == 'macOS'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          dotnet workload install ios android
          dotnet build src/PanAndZoom.Uno -c Release "-p:PanAndZoomTargetFrameworks=net10.0-ios%3Bnet10.0-android"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test/**/*.trx
            artifacts/test-results/uno-runtime-tests.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: >
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Test Results (${{ matrix.os }})
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  # Uno sample: desktop self-test (every demo page) and WebAssembly publish.
  sample:
    name: Uno sample
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install X11 dependencies and wasm-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libx11-6 libxcursor1 libxrandr2 libxi6 libfontconfig1 libice6 libsm6
          dotnet workload install wasm-tools

      - name: Build desktop sample
        run: dotnet build samples/UnoDemo -c Release -f net10.0-desktop -p:PanAndZoomTargetFrameworks=net10.0-desktop -p:UnoDemoTargetFrameworks=net10.0-desktop

      - name: Run sample self-test (all demo pages)
        env:
          UNODEMO_SELFTEST: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" dotnet run --project samples/UnoDemo -c Release -f net10.0-desktop --no-build -p:PanAndZoomTargetFrameworks=net10.0-desktop -p:UnoDemoTargetFrameworks=net10.0-desktop

      - name: Publish WebAssembly sample
        run: dotnet publish samples/UnoDemo -c Release -f net10.0-browserwasm -p:PanAndZoomTargetFrameworks=net10.0-browserwasm -p:UnoDemoTargetFrameworks=net10.0-browserwasm -o artifacts/unodemo-wasm

      - name: Upload WebAssembly sample
        uses: actions/upload-artifact@v4
        with:
          name: unodemo-wasm
          path: artifacts/unodemo-wasm/wwwroot
          if-no-files-found: error
          retention-days: 7

  # All NuGet packages and the native WinUI projects. Windows is required for the WinAppSDK target of PanAndZoom.Uno,
  # whose XAML can only be compiled by msbuild (UNOB0008). The Windows image already ships
  # the Android, iOS and WebAssembly workloads.
  pack:
    name: Pack
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> $GITHUB_ENV
          else
            echo "VERSION_SUFFIX=-build.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Pack PanAndZoom, PanAndZoom.Core and HeadlessTestingFramework
        run: dotnet pack PanAndZoom.slnx -c Release -p:VersionSuffix="${{ env.VERSION_SUFFIX }}" -o artifacts/packages

      - name: Pack PanAndZoom.Uno
        shell: pwsh
        run: msbuild src/PanAndZoom.Uno/PanAndZoom.Uno.csproj -t:Pack -r -m -p:Configuration=Release -p:VersionSuffix="${{ env.VERSION_SUFFIX }}" -p:PackageOutputPath="$env:GITHUB_WORKSPACE/artifacts/packages"

      - name: Pack PanAndZoom.WinUI
        run: dotnet pack src/PanAndZoom.WinUI -c Release -p:VersionSuffix="${{ env.VERSION_SUFFIX }}" -o artifacts/packages

      # The WinUI runtime tests need an interactive desktop for real input injection, so CI only
      # builds the WinUI sample and test app (build/run-winui-runtime-tests.ps1 runs them locally).
      - name: Build WinUI sample and runtime tests
        run: dotnet build PanAndZoom.WinUI.slnx -c Release

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30
